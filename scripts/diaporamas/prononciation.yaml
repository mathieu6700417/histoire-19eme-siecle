# Lexique de prononciation des diaporamas (spec 12).
# « Mot: graphie » : la graphie remplace le mot (mot entier, sensible à la casse) dans le
# texte envoyé à la voix de synthèse SEULEMENT ; les sous-titres gardent le texte du script.
# Repris de ~/ai-projects/histoire-19eme-siecle/collections/xix-france/prononciation.yaml,
# puis enrichi à l'écoute.
Talleyrand: Tal-ran
Cambacérès: Kan-ba-cé-rèss
Guizot: Gui-zo
# Numéros de rois et de papes : lus « seize », jamais « quinze cents » ni « X V I ».
Louis XIV: Louis quatorze
Louis XV: Louis quinze
Louis XVI: Louis seize
Louis XVII: Louis dix-sept
Louis XVIII: Louis dix-huit
Pie VI: Pie six
Pie VII: Pie sept
Charles IV: Charles quatre
Ferdinand VII: Ferdinand sept
François II: François deux
Frédéric-Guillaume III: Frédéric-Guillaume trois
Georges III: Georges trois
# Siècles.
XVIIIe siècle: dix-huitième siècle
XIXe siècle: dix-neuvième siècle
# Calendrier républicain : an II, an III… lus en toutes lettres.
an Ier: an un
an I: an un
an II: an deux
an III: an trois
an IV: an quatre
an V: an cinq
an VI: an six
an VII: an sept
an VIII: an huit
an IX: an neuf
an X: an dix
an XI: an onze
an XII: an douze
an XIII: an treize
an XIV: an quatorze
